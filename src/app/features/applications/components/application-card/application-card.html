<article
  (click)="onClick()"
  class="cursor-pointer rounded-lg border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md"
>
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="font-semibold text-slate-900">{{ application().company }}</h3>
      <p class="text-sm text-slate-600">{{ application().role }}</p>
    </div>
    <span class="rounded-full px-2.5 py-0.5 text-xs font-medium" [class]="statusClasses()">
      {{ application().status }}
    </span>
  </div>
  <div class="mt-3 flex items-center justify-between gap-3" (click)="$event.stopPropagation()">
    <button
      (click)="onDelete(); $event.stopPropagation()"
      class="mt-3 rounded-md bg-red-600 px-3 py-1.5 text-sm text-white hover:bg-red-700"
    >
      Delete
    </button>
    <select
      (change)="onStatusChange($event); $event.stopPropagation()"
      class="mt-3 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-900 focus:border-slate-500 focus:outline-none"
    >
      @for (status of ['WISHLIST', 'APPLIED', 'INTERVIEW', 'OFFER', 'REJECTED']; track status) {
        <option [value]="status" [selected]="status === application().status">
          {{ status }}
        </option>
      }
    </select>
  </div>
</article>
